<div class="garage-container page">
  <h1>Welcome back, {{ firstName() }}</h1>

  <garage-alert tone="info">You have 1 report due in the next 30 days.</garage-alert>

  <section class="stats" aria-label="Summary">
    @for (stat of stats; track stat.label) {
      <garage-card>
        <p class="stat-value">{{ stat.value }}</p>
        <p class="stat-label">{{ stat.label }}</p>
      </garage-card>
    }
  </section>

  <section class="programs" aria-labelledby="programs-heading">
    <h2 id="programs-heading">Grant programs</h2>
    <div class="program-grid">
      @for (program of programs; track program.code) {
        <garage-card>
          <h3>
            <a [routerLink]="program.path">{{ program.name }}</a>
          </h3>
          <p>{{ program.summary }}</p>
        </garage-card>
      }
    </div>
  </section>
</div>
